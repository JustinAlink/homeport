name: Release

# Pushing a v* tag builds + publishes the multi-arch image to GHCR and creates
# the GitHub Release with that version's CHANGELOG section as its notes.
# Uses only the workflow's own GITHUB_TOKEN — no PAT to manage.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release
  packages: write # push to ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/justinalink/homeport:${{ github.ref_name }}
            ghcr.io/justinalink/homeport:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract this version's changelog section
        run: |
          node -e '
            const fs = require("fs")
            const tag = process.env.GITHUB_REF_NAME
            const sec = fs.readFileSync("CHANGELOG.md", "utf8").split(/^## /m).find((s) => s.startsWith(tag))
            const body = sec ? sec.split("\n").slice(1).join("\n").trim() : "See CHANGELOG.md."
            fs.writeFileSync("release-notes.md", body + "\n")
          '

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
