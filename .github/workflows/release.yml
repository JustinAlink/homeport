name: Release

# Pushing a v* tag builds + publishes the multi-arch image to GHCR and creates
# the GitHub Release with that version's CHANGELOG section as its notes.
# Uses only the workflow's own GITHUB_TOKEN — no PAT to manage.
#
# Each architecture builds NATIVELY on its own runner (GitHub's arm64 runners
# are free for public repos) — QEMU emulation is deliberately avoided: Node
# deadlocks under qemu-user (io_uring), which hangs `nuxt build` forever.
# The per-arch images are pushed by digest and merged into one manifest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release
  packages: write # push to ghcr.io

env:
  IMAGE: ghcr.io/justinalink/homeport

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # for the CHANGELOG, and every tag
        with:
          fetch-depth: 0

      # Only the highest version may move :latest and the "Latest" release.
      # Tags pushed out of order (or a re-run of an old release) would otherwise
      # point :latest back at an older image: v2.31.2 was tagged after the
      # v2.32.0 security fix, and only an unrelated build failure kept :latest
      # on the fix.
      - name: Decide whether this is the newest version
        id: newest
        run: |
          tags=$(git tag -l 'v*')
          # No tag list means no way to tell; stop rather than guess either way.
          if ! grep -qxF "$GITHUB_REF_NAME" <<< "$tags"; then
            echo "::error::$GITHUB_REF_NAME is missing from the fetched tags"
            exit 1
          fi
          highest=$(sort -V <<< "$tags" | tail -n 1)
          latest=false
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then latest=true; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME (highest tag: $highest) gets latest=$latest"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the per-arch digests into one manifest
        working-directory: /tmp/digests
        env:
          LATEST: ${{ steps.newest.outputs.latest }}
        run: |
          tags=(-t "$IMAGE:$GITHUB_REF_NAME")
          if [ "$LATEST" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"

      - name: Extract this version's changelog section
        run: |
          node -e '
            const fs = require("fs")
            const tag = process.env.GITHUB_REF_NAME
            const sec = fs.readFileSync("CHANGELOG.md", "utf8").split(/^## /m).find((s) => s.startsWith(tag))
            const body = sec ? sec.split("\n").slice(1).join("\n").trim() : "See CHANGELOG.md."
            fs.writeFileSync("release-notes.md", body + "\n")
          '

      # Re-running the job updates an existing release instead of failing on it.
      # An edit only ever promotes: an older release being re-run leaves the
      # "Latest" badge where it is.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.newest.outputs.latest }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            promote=()
            if [ "$LATEST" = true ]; then promote=(--latest); fi
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${promote[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest="$LATEST"
          fi
