name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Chromium alone downloads in seconds; `--with-deps` also apt-installs system
      # libraries, which once took 12 minutes from a slow mirror. The runner image
      # already has them (it ships Chrome), so only fall back to apt if a launch fails.
      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium
      - name: Smoke test (demo build, every page)
        run: npm run smoke

  # Browser suites (test/e2e): every page and flow in demo mode, plus an
  # accessibility gate. Its own job so the ~7 minutes run beside the unit tests.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium
      - run: npm run e2e

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh is served as `curl … | sh`, so lint it. shellcheck ships on the runner.
      - run: shellcheck -s sh install.sh
