# Local build (no GHCR). Run:  docker compose -f docker-compose.build.yml up -d --build

services:
  homeport:
    build:
      context: .
    container_name: homeport
    restart: unless-stopped
    environment:
      HOMEPORT_ADMIN_PASSWORD: ${HOMEPORT_ADMIN_PASSWORD}
      HOMEPORT_SESSION_SECRET: ${HOMEPORT_SESSION_SECRET}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      NPM_CONF_DIR: /npm
      HOMEPORT_DATA_DIR: /data
    volumes:
      - homeport-data:/data
      - ${NPM_HOST_CONF_DIR:-/path/to/nginx-proxy-manager/data/nginx/proxy_host}:/npm:ro
    ports:
      - "${HOMEPORT_PORT:-3004}:3000"
    networks:
      - npm-network
      - internal
    depends_on:
      - docker-socket-proxy

  docker-socket-proxy:
    # Pinned by digest (see docker-compose.yml for how to refresh it).
    image: tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: homeport-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      EVENTS: 1
      PING: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

networks:
  npm-network:
    external: true
  internal:
    driver: bridge

volumes:
  homeport-data:
