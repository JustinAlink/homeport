# Production — pulls the prebuilt image from GHCR (built by GitHub Actions).
# Local build instead:  docker compose -f docker-compose.build.yml up -d --build
#
# Easiest setup (does everything below for you):
#   curl -fsSL https://raw.githubusercontent.com/JustinAlink/homeport/main/install.sh | sh
#
# Manual setup:
#   1. docker network create npm-network        # the shared reverse-proxy network (required)
#   2. cp .env.example .env  &&  edit it
#   3. docker compose up -d

services:
  homeport:
    image: ghcr.io/${GHCR_OWNER:-justinalink}/homeport:${IMAGE_TAG:-latest}
    container_name: homeport
    restart: unless-stopped
    environment:
      # Optional — leave unset to set the password in-app on first run (env wins if set).
      HOMEPORT_ADMIN_PASSWORD: ${HOMEPORT_ADMIN_PASSWORD:-}
      HOMEPORT_SESSION_SECRET: ${HOMEPORT_SESSION_SECRET:-}
      # Talk to Docker via the read-only socket proxy below (never the raw socket).
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Where the settings page persists its config.
      HOMEPORT_DATA_DIR: /data
      # Domain mapping from Nginx Proxy Manager (optional): set NPM_HOST_CONF_DIR
      # in .env and uncomment this + the matching volume below.
      # NPM_CONF_DIR: /npm
    volumes:
      - homeport-data:/data
      # Reverse-proxy domain mapping (optional): point NPM_HOST_CONF_DIR (in .env) at your
      # Nginx Proxy Manager proxy-host confs, then uncomment this line + NPM_CONF_DIR above.
      # - ${NPM_HOST_CONF_DIR:-/path/to/nginx-proxy-manager/data/nginx/proxy_host}:/npm:ro
      # Stack manager (HOMEPORT_ALLOW_STACKS=true): mount your compose dir.
      # Each subdirectory containing a compose.yaml is a stack.
      # - /opt/stacks:/stacks
    ports:
      # Host port to publish (set HOMEPORT_PORT in .env). Container always listens on 3000.
      # HOMEPORT_BIND=127.0.0.1 publishes on loopback only (see .env.example); unset
      # keeps every interface, IPv4 and IPv6.
      - "${HOMEPORT_BIND:+${HOMEPORT_BIND}:}${HOMEPORT_PORT:-3004}:3000"
    networks:
      - npm-network # reachable by the reverse proxy
      - internal # reach the socket proxy
    depends_on:
      - docker-socket-proxy

  # Read-only Docker API proxy — exposes only what homeport needs, so the app
  # never gets raw (root-equivalent) access to /var/run/docker.sock.
  docker-socket-proxy:
    # Pinned by digest — this is the most security-sensitive dependency, so don't
    # float on :latest. Update: docker pull tecnativa/docker-socket-proxy:latest &&
    # docker inspect --format '{{index .RepoDigests 0}}' tecnativa/docker-socket-proxy:latest
    image: tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: homeport-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      EVENTS: 1
      PING: 1
      # everything else stays denied (default 0). Per-capability extras:
      #   start/stop/restart        → POST: 1
      #   update checks             → DISTRIBUTION: 1
      #   apply updates             → IMAGES: 1, POST: 1
      #   compose stacks            → POST: 1, IMAGES: 1, NETWORKS: 1, VOLUMES: 1
      #   web terminal              → EXEC: 1, POST: 1
      #   edit files in containers  → POST: 1   (PUT on /containers/*/archive)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

networks:
  npm-network:
    external: true
  internal:
    driver: bridge

volumes:
  homeport-data:
